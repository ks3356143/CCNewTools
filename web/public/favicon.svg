  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="27" y="10" width="24" height="33" rx="3.5" fill="#FFFFFF" opacity="0.55"/>
  <rect x="13" y="20" width="27" height="35" rx="3.5" fill="#FFFFFF"/>
  <rect x="19" y="30" width="15" height="3.6" rx="1.8" fill="#2D5B91"/>
